<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitrostat 用藥安全練習</title>
<style>
  body {
    margin: 0;
    background: #FAF8F4;
    color: #1F3A33;
    font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    padding: 32px 20px;
  }

  .quiz-wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  .page-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 20px;
    color: #1F3A33;
    line-height: 1.6;
    text-align: center;
  }

  .progress {
    font-size: 13px;
    color: #5C6B66;
    margin: 0 0 16px;
    font-weight: 500;
    text-align: center;
  }

  .quiz-card {
    background: #FFFFFF;
    border: 1px solid #E7E2D8;
    border-radius: 16px;
    padding: 28px 28px 24px;
  }

  .sentence {
    font-size: 16px;
    line-height: 2.6;
    margin: 0 0 6px;
    color: #1F3A33;
  }

  .blank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 90px;
    height: 32px;
    padding: 0 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    vertical-align: middle;
    margin: 0 4px;
    transition: background 0.15s ease;
  }

  .blank-empty {
    border: 1.5px dashed #C9C2B4;
    background: #FAF8F4;
    color: #A8A096;
  }

  .blank-filled {
    border: 1.5px solid #5C8AA6;
    background: #EAF1F5;
    color: #2D5670;
  }

  .blank-correct {
    border: 1.5px solid #5B8C6B;
    background: #EBF4EC;
    color: #3A6B47;
  }

  .blank-wrong {
    border: 1.5px solid #D97B4F;
    background: #FBEAE1;
    color: #B8542A;
  }

  .options-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid #E7E2D8;
  }

  .option-btn {
    font-family: inherit;
    border: 1px solid #E7E2D8;
    background: #FFFFFF;
    color: #1F3A33;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: #D97B4F;
    transform: translateY(-1px);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .footer-row {
    margin-top: 24px;
  }

  .check-btn {
    font-family: inherit;
    display: block;
    margin-left: auto;
    border: 1px solid #1F3A33;
    background: #1F3A33;
    color: #fff;
    padding: 10px 28px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .check-btn:hover:not(:disabled) {
    background: #D97B4F;
    border-color: #D97B4F;
  }

  .check-btn:disabled {
    background: #C9C2B4;
    border-color: #C9C2B4;
    cursor: default;
  }

  .result-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
  }

  .result-success {
    background: #EBF4EC;
    color: #3A6B47;
  }

  .result-danger {
    background: #FBEAE1;
    color: #B8542A;
  }

  .retry-btn {
    font-family: inherit;
    flex-shrink: 0;
    border: 1px solid #D97B4F;
    background: #fff;
    color: #D97B4F;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .retry-btn:hover {
    background: #D97B4F;
    color: #fff;
  }

  .finish-banner {
    text-align: center;
    padding: 40px 20px;
  }

  .finish-banner .big {
    font-size: 20px;
    font-weight: 700;
    color: #1F3A33;
    margin-bottom: 8px;
  }

  .finish-banner .small {
    font-size: 14px;
    color: #5C6B66;
  }

  .back-link {
    display: inline-block;
    margin-top: 24px;
    font-size: 14px;
    font-weight: 700;
    color: #5C8AA6;
    text-decoration: none;
    border-bottom: 1px solid #5C8AA6;
    padding-bottom: 2px;
  }

  .back-link:hover {
    color: #D97B4F;
    border-bottom-color: #D97B4F;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
  }
</style>
</head>
<body>

<div class="quiz-wrap">
  <div class="quiz-card">
    <div id="quiz-root"></div>
  </div>
</div>

<script>
(function(){
  const pages = [
    {
      title: "Nitrostat 功能與正確使用方式",
      groups: [
        {segments: ["Nitrostat 舌下錠的主要成分是", "GAP", "，常用於預防或緩解心絞痛。"], answers: ["硝酸甘油"]},
        {segments: ["當急性胸痛發作時，應將藥錠含於", "GAP", "，不可嚼碎或整粒吞服。"], answers: ["舌下"]},
        {segments: ["舌下含藥時建議坐下，以免因血壓下降發生", "GAP", "。"], answers: ["暈眩"]},
        {segments: ["若症狀未緩解，可每隔五分鐘重複使用一粒，但總共不超過", "GAP", "。"], answers: ["三次"]},
        {segments: ["若在十五分鐘內已使用三粒仍無效，應立即", "GAP", "。"], answers: ["就醫"]}
      ],
      distractors: ["五次","普拿疼","手心","一次","阿司匹林","發燒","喝水","休息","咳嗽","口腔"]
    },
    {
      title: "Nitrostat 保存與服用注意事項",
      groups: [
        {
          segments: ["此藥品需存放於原玻璃容器並將瓶蓋", "GAP", "，避免受潮或受塑膠成分影響。儲存時應選擇陰涼乾燥處，並避免直接", "GAP", "。"],
          answers: ["拴緊", "照光"]
        },
        {
          segments: ["服用後可能會出現輕微頭痛或暈眩，做危險性工作如開車時需特別", "GAP", "。若出現過敏反應、視力模糊等不良症狀，應儘快告知", "GAP", "。"],
          answers: ["小心", "醫師"]
        },
        {
          segments: ["Nitrostat 舌下錠不可與威而鋼、犀利士等藥品", "GAP", "。"],
          answers: ["併用"]
        }
      ],
      distractors: ["分開","放鬆","加熱","搖晃","朋友","打開","鬆脫","隨意","家人","混合"]
    }
  ];

  let pageIndex = 0;
  let options = [];
  let filled = {};
  let checked = false;

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function initPage(){
    const page = pages[pageIndex];
    const flatBlanks = getFlatBlanks(page);
    options = shuffle(flatBlanks.map(b=>b.answer).concat(page.distractors));
    filled = {};
    checked = false;
    render();
  }

  function getFlatBlanks(page){
    // 把所有 group 裡的答案展平成一個全域列表，每個空格記錄所屬 group
    const flat = [];
    page.groups.forEach((g, gi) => {
      g.answers.forEach((ans, ai) => {
        flat.push({ groupIndex: gi, answerIndexInGroup: ai, answer: ans });
      });
    });
    return flat;
  }

  function selectOption(opt){
    if(checked) return;
    const page = pages[pageIndex];
    const flatBlanks = getFlatBlanks(page);
    if(Object.values(filled).includes(opt)) return;
    const emptyIdx = flatBlanks.findIndex((b, i) => !filled[i]);
    if(emptyIdx === -1) return;
    filled[emptyIdx] = opt;
    render();
  }

  function clearBlank(idx){
    if(checked) return;
    delete filled[idx];
    render();
  }

  function checkAnswers(){
    checked = true;
    render();
  }

  function retryPage(){
    initPage();
  }

  function nextPage(){
    if(pageIndex < pages.length - 1){
      pageIndex++;
      initPage();
    } else {
      renderFinish();
    }
  }

  function renderFinish(){
    const root = document.getElementById('quiz-root');
    root.innerHTML = `
      <div class="finish-banner">
        <div class="big">✓ 全部練習完成！</div>
        <div class="small">您已完成 Nitrostat 用藥安全相關練習。</div>
        <a class="back-link" href="https://pha.lib.cmuh.org.tw/p/PHlearning">回藥劑部學習平台</a>
      </div>
    `;
  }

  function render(){
    const root = document.getElementById('quiz-root');
    const page = pages[pageIndex];
    const flatBlanks = getFlatBlanks(page);
    const allFilled = flatBlanks.every((b,i)=>filled[i]);
    const usedOptions = new Set(Object.values(filled));

    let blankGlobalIndex = 0;

    let groupsHtml = page.groups.map((g) => {
      let html = `<p class="sentence">`;
      g.segments.forEach(seg => {
        if(seg === "GAP"){
          const i = blankGlobalIndex;
          const blankInfo = flatBlanks[i];
          const val = filled[i];
          let cls = "blank ";
          let content = "&nbsp;";

          if(!val){
            cls += "blank-empty";
          } else if(!checked){
            cls += "blank-filled";
            content = val;
          } else {
            const isCorrect = val === blankInfo.answer;
            cls += isCorrect ? "blank-correct" : "blank-wrong";
            content = val + (isCorrect ? " ✓" : " ✗");
          }

          const clickAttr = !checked ? `onclick="window.__quiz.clearBlank(${i})"` : "";
          html += `<span class="${cls}" ${clickAttr}>${content}</span>`;
          blankGlobalIndex++;
        } else {
          html += seg;
        }
      });
      html += `</p>`;
      return html;
    }).join("");

    let optionsHtml = options.map(opt => {
      const used = usedOptions.has(opt);
      const disabled = used || checked;
      return `<button
        class="option-btn"
        onclick="window.__quiz.selectOption('${opt.replace(/'/g,"\\'")}')"
        ${disabled ? 'disabled' : ''}
        style="opacity:${used ? 0.35 : 1};"
      >${opt}</button>`;
    }).join("");

    let footer = "";
    if(checked){
      const allCorrect = flatBlanks.every((b,i)=>filled[i]===b.answer);
      if(allCorrect){
        const isLastPage = pageIndex === pages.length - 1;
        footer = `<div class="result-banner result-success">
          <span>✓ 所有答案都正確！非常好！</span>
          <button class="retry-btn" onclick="window.__quiz.nextPage()">${isLastPage ? '完成' : '下一頁'}</button>
        </div>`;
      } else {
        footer = `<div class="result-banner result-danger">
          <span>✗ 有答案不正確，請再試一次</span>
          <button class="retry-btn" onclick="window.__quiz.retryPage()">重新作答</button>
        </div>`;
      }
    } else {
      footer = `<button class="check-btn" onclick="window.__quiz.checkAnswers()" ${!allFilled ? 'disabled' : ''}>檢查</button>`;
    }

    root.innerHTML = `
      <h2 class="page-title">${page.title}</h2>
      <p class="progress">第 ${pageIndex + 1} / ${pages.length} 頁</p>
      <div>${groupsHtml}</div>
      <div class="options-row">${optionsHtml}</div>
      <div class="footer-row">${footer}</div>
    `;
  }

  window.__quiz = { selectOption, clearBlank, checkAnswers, retryPage, nextPage };
  initPage();
})();
</script>

</body>
</html>
