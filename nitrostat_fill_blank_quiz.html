<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitrostat 用藥安全練習</title>
<style>
  body {
    margin: 0;
    background: #FAF8F4;
    color: #1F3A33;
    font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    padding: 32px 20px;
  }
  .quiz-wrap { max-width: 720px; margin: 0 auto; }
  .page-title {
    font-size: 22px; font-weight: 700; margin: 0 0 20px;
    color: #1F3A33; line-height: 1.6; text-align: center;
  }
  .progress {
    font-size: 13px; color: #5C6B66; margin: 0 0 4px;
    font-weight: 500; text-align: center;
  }
  .timer {
    font-size: 13px; color: #5C6B66; margin: 0 0 16px;
    font-weight: 500; text-align: center; letter-spacing: 0.5px;
  }
  .timer-final { font-size: 16px; font-weight: 700; color: #1F3A33; margin: 4px 0 0; }
  .quiz-card {
    background: #FFFFFF; border: 1px solid #E7E2D8;
    border-radius: 16px; padding: 28px 28px 24px;
  }
  .sentence { font-size: 16px; line-height: 2.6; margin: 0 0 6px; color: #1F3A33; }
  .blank {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 90px; height: 32px; padding: 0 12px; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    vertical-align: middle; margin: 0 4px; transition: background 0.15s ease;
  }
  .blank-empty  { border: 1.5px dashed #C9C2B4; background: #FAF8F4; color: #A8A096; }
  .blank-filled { border: 1.5px solid #5C8AA6; background: #EAF1F5; color: #2D5670; }
  .blank-correct{ border: 1.5px solid #5B8C6B; background: #EBF4EC; color: #3A6B47; }
  .blank-wrong  { border: 1.5px solid #D97B4F; background: #FBEAE1; color: #B8542A; }
  .options-row {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-top: 28px; padding-top: 24px; border-top: 1px solid #E7E2D8;
  }
  .option-btn {
    font-family: inherit; border: 1px solid #E7E2D8; background: #FFFFFF;
    color: #1F3A33; padding: 8px 16px; border-radius: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .option-btn:hover:not(:disabled) { border-color: #D97B4F; transform: translateY(-1px); }
  .option-btn:disabled { cursor: default; }
  .footer-row { margin-top: 24px; }
  .check-btn {
    font-family: inherit; display: block; margin-left: auto;
    border: 1px solid #1F3A33; background: #1F3A33; color: #fff;
    padding: 10px 28px; border-radius: 8px; font-size: 14px;
    font-weight: 700; cursor: pointer; transition: background 0.15s ease;
  }
  .check-btn:hover:not(:disabled) { background: #D97B4F; border-color: #D97B4F; }
  .check-btn:disabled { background: #C9C2B4; border-color: #C9C2B4; cursor: default; }
  .result-banner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 18px; border-radius: 10px; font-size: 14px; font-weight: 700;
  }
  .result-success { background: #EBF4EC; color: #3A6B47; }
  .result-danger  { background: #FBEAE1; color: #B8542A; }
  .retry-btn {
    font-family: inherit; flex-shrink: 0; border: 1px solid #D97B4F;
    background: #fff; color: #D97B4F; padding: 8px 18px;
    border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .retry-btn:hover { background: #D97B4F; color: #fff; }
  .finish-banner { text-align: center; padding: 40px 20px; }
  .finish-banner .big { font-size: 20px; font-weight: 700; color: #1F3A33; margin-bottom: 8px; }
  .finish-banner .small { font-size: 14px; color: #5C6B66; }
  .back-link {
    display: inline-block; margin-top: 24px; font-size: 14px;
    font-weight: 700; color: #5C8AA6; text-decoration: none;
    border-bottom: 1px solid #5C8AA6; padding-bottom: 2px;
  }
  .back-link:hover { color: #D97B4F; border-bottom-color: #D97B4F; }
</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="quiz-card">
    <div id="quiz-root"><p class="progress">載入中...</p></div>
  </div>
</div>
<script>
(function(){
  const pages = [
    {
      title: "Nitrostat 功能與正確使用方式",
      groups: [
        {segments: ["Nitrostat 舌下錠的主要成分是", "GAP", "，常用於預防或緩解心絞痛。"], answers: ["硝酸甘油"]},
        {segments: ["當急性胸痛發作時，應將藥錠含於", "GAP", "，不可嚼碎或整粒吞服。"], answers: ["舌下"]},
        {segments: ["舌下含藥時建議", "GAP", "，以免因血壓下降發生", "GAP", "。"], answers: ["坐下", "暈眩"]},
        {segments: ["若症狀未緩解，可每隔五分鐘重複使用一粒，但總共不超過", "GAP", "。"], answers: ["三次"]},
        {segments: ["若在十五分鐘內已使用三粒仍無效，應立即就醫。"], answers: []}
      ],
      distractors: ["咳嗽", "阿司匹林", "發燒", "手心", "口腔", "五次", "一次", "普拿疼", "喝水", "站立"]
    },
    {
      title: "Nitrostat 保存與服用注意事項",
      groups: [
        {
          segments: ["此藥品需存放於", "GAP", "並將瓶蓋", "GAP", "，避免受潮或受塑膠成分影響。儲存時應選擇陰涼乾燥處，並避免直接", "GAP", "。"],
          answers: ["原玻璃容器", "拴緊", "照光"]
        },
        {
          segments: ["服用後可能會出現輕微", "GAP", "或暈眩，做危險性工作如開車時需特別小心。若出現過敏反應、視力模糊等不良症狀，應儘快告知醫師。"],
          answers: ["頭痛"]
        },
        {
          segments: ["Nitrostat 舌下錠不可與威而鋼、犀利士等藥品併用。"],
          answers: []
        }
      ],
      distractors: ["搖晃", "鬆脫", "隨意", "打開", "加熱", "夾鏈袋", "分裝藥盒", "愉悅"]
    }
  ];

  let pageIndex = 0, options = [], filled = {}, checked = false;
  let elapsedSeconds = 0, timerInterval = null;

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function formatTime(s){
    return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }
  function startTimer(){
    if(timerInterval) return;
    timerInterval=setInterval(()=>{
      elapsedSeconds++;
      const el=document.getElementById('quiz-timer');
      if(el) el.textContent='已花費時間：'+formatTime(elapsedSeconds);
    },1000);
  }
  function stopTimer(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  }
  function getFlatBlanks(page){
    const flat=[];
    page.groups.forEach(g=>g.answers.forEach(ans=>flat.push({answer:ans})));
    return flat;
  }
  function initPage(){
    const page=pages[pageIndex];
    const flat=getFlatBlanks(page);
    options=shuffle(flat.map(b=>b.answer).concat(page.distractors));
    filled={}; checked=false;
    render(); startTimer();
  }
  function selectOption(opt){
    if(checked) return;
    const flat=getFlatBlanks(pages[pageIndex]);
    if(Object.values(filled).includes(opt)) return;
    const idx=flat.findIndex((b,i)=>!filled[i]);
    if(idx===-1) return;
    filled[idx]=opt; render();
  }
  function clearBlank(idx){ if(checked) return; delete filled[idx]; render(); }
  function checkAnswers(){ checked=true; render(); }
  function retryPage(){ initPage(); }
  function nextPage(){
    if(pageIndex<pages.length-1){ pageIndex++; initPage(); }
    else { renderFinish(); }
  }
  function renderFinish(){
    stopTimer();
    document.getElementById('quiz-root').innerHTML=`
      <div class="finish-banner">
        <div class="big">✓ 全部練習完成！</div>
        <div class="small">您已完成 Nitrostat 用藥安全相關練習。</div>
        <div class="timer-final">總耗時：${formatTime(elapsedSeconds)}</div>
        <a class="back-link" href="https://pha.lib.cmuh.org.tw/p/PHlearning">回藥劑部學習平台</a>
      </div>`;
  }
  function render(){
    const page=pages[pageIndex];
    const flat=getFlatBlanks(page);
    const allFilled=flat.every((b,i)=>filled[i]);
    const used=new Set(Object.values(filled));
    let gi=0;
    const groupsHtml=page.groups.map(g=>{
      let html='<p class="sentence">';
      g.segments.forEach(seg=>{
        if(seg==='GAP'){
          const i=gi, info=flat[i], val=filled[i];
          let cls='blank ', content='&nbsp;';
          if(!val) cls+='blank-empty';
          else if(!checked){ cls+='blank-filled'; content=val; }
          else{
            const ok=val===info.answer;
            cls+=ok?'blank-correct':'blank-wrong';
            content=val+(ok?' ✓':' ✗');
          }
          const click=!checked?`onclick="window.__quiz.clearBlank(${i})"`:'';
          html+=`<span class="${cls}" ${click}>${content}</span>`;
          gi++;
        } else { html+=seg; }
      });
      return html+'</p>';
    }).join('');
    const optionsHtml=options.map(opt=>{
      const isUsed=used.has(opt);
      return `<button class="option-btn"
        onclick="window.__quiz.selectOption('${opt.replace(/'/g,"\\'")}')"
        ${isUsed||checked?'disabled':''}
        style="opacity:${isUsed?0.35:1};">${opt}</button>`;
    }).join('');
    let footer='';
    if(checked){
      const allOk=flat.every((b,i)=>filled[i]===b.answer);
      const isLast=pageIndex===pages.length-1;
      footer=allOk
        ?`<div class="result-banner result-success"><span>✓ 所有答案都正確！非常好！</span><button class="retry-btn" onclick="window.__quiz.nextPage()">${isLast?'完成':'下一頁'}</button></div>`
        :`<div class="result-banner result-danger"><span>✗ 有答案不正確，請再試一次</span><button class="retry-btn" onclick="window.__quiz.retryPage()">重新作答</button></div>`;
    } else {
      footer=`<button class="check-btn" onclick="window.__quiz.checkAnswers()" ${!allFilled?'disabled':''}>檢查</button>`;
    }
    document.getElementById('quiz-root').innerHTML=`
      <h2 class="page-title">${page.title}</h2>
      <p class="progress">第 ${pageIndex+1} / ${pages.length} 頁</p>
      <p class="timer" id="quiz-timer">已花費時間：${formatTime(elapsedSeconds)}</p>
      <div>${groupsHtml}</div>
      <div class="options-row">${optionsHtml}</div>
      <div class="footer-row">${footer}</div>`;
  }
  window.__quiz={selectOption,clearBlank,checkAnswers,retryPage,nextPage};
  initPage();
})();
</script>
</body></html>
