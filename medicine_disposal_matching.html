<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藥品正確保存與丟棄重點整理：比對中</title>
<style>
  body {
    margin: 0;
    background: #FAF8F4;
    color: #1F3A33;
    font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    padding: 32px 20px;
  }

  .quiz-wrap {
    max-width: 880px;
    margin: 0 auto;
  }

  .page-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
    color: #1F3A33;
    line-height: 1.6;
    text-align: center;
  }

  .subtitle {
    font-size: 14px;
    color: #5C6B66;
    text-align: center;
    margin: 0 0 4px;
  }

  .progress {
    font-size: 13px;
    color: #5C6B66;
    margin: 0 0 20px;
    font-weight: 500;
    text-align: center;
  }

  .quiz-card {
    background: #FFFFFF;
    border: 1px solid #E7E2D8;
    border-radius: 16px;
    padding: 24px;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    align-items: stretch;
  }

  @media (max-width: 640px) {
    .board {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .match-card {
    border: 1.5px solid #E7E2D8;
    background: #FFFFFF;
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1.6;
    color: #1F3A33;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 88px;
    transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
    user-select: none;
  }

  .match-card.title-card {
    font-weight: 700;
    font-size: 14px;
    background: #FAF8F4;
  }

  .match-card:hover:not(.matched):not(.disabled) {
    border-color: #D97B4F;
    transform: translateY(-2px);
  }

  .match-card.selected {
    border-color: #5C8AA6;
    background: #EAF1F5;
  }

  .match-card.matched {
    border-color: #5B8C6B;
    background: #EBF4EC;
    color: #3A6B47;
    opacity: 0.45;
    cursor: default;
  }

  .match-card.wrong {
    border-color: #D97B4F !important;
    background: #FBEAE1 !important;
    color: #B8542A !important;
    animation: shake 0.3s ease;
  }

  .match-card.wrong::after {
    content: "✗";
    display: block;
    font-size: 18px;
    font-weight: 700;
    margin-top: 4px;
    color: #D97B4F;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  .footer-row {
    margin-top: 24px;
    display: flex;
    justify-content: flex-end;
  }

  .next-btn {
    font-family: inherit;
    border: 1px solid #1F3A33;
    background: #1F3A33;
    color: #fff;
    padding: 10px 28px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .next-btn:hover {
    background: #D97B4F;
    border-color: #D97B4F;
  }

  .result-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    background: #EBF4EC;
    color: #3A6B47;
    margin-top: 24px;
  }

  .finish-banner {
    text-align: center;
    padding: 40px 20px;
  }

  .finish-banner .big {
    font-size: 20px;
    font-weight: 700;
    color: #1F3A33;
    margin-bottom: 8px;
  }

  .finish-banner .small {
    font-size: 14px;
    color: #5C6B66;
  }

  .back-link {
    display: inline-block;
    margin-top: 24px;
    font-size: 14px;
    font-weight: 700;
    color: #5C8AA6;
    text-decoration: none;
    border-bottom: 1px solid #5C8AA6;
    padding-bottom: 2px;
  }

  .back-link:hover {
    color: #D97B4F;
    border-bottom-color: #D97B4F;
  }
</style>
</head>
<body>

<div class="quiz-wrap">
  <div class="quiz-card">
    <div id="quiz-root"></div>
  </div>
</div>

<script>
(function(){
  const pages = [
    {
      title: "藥品正確保存與丟棄重點整理：比對中",
      subtitle: "請點選兩張卡片，將標題與對應的說明文配對",
      pairs: [
        { title: "藥品保存要點", desc: "藥品應避光、避濕、避熱，並依說明書指示儲存，開封後要密封保存。" },
        { title: "須由醫療機構回收的廢棄藥品", desc: "針劑、抗腫瘤藥物、抗生素、荷爾蒙及1-3級管制性藥物等，需送回醫療機構或藥局回收。" },
        { title: "一般藥品丟棄", desc: "可將藥品剝出包裝，與吸水物質密封後隨一般垃圾丟棄，包裝容器則回收。" },
        { title: "藥水丟棄步驟", desc: "將藥水倒入含吸水物質的袋中密封，再隨一般垃圾丟棄，勿倒入馬桶或水槽。" },
        { title: "藥品保存期限", desc: "標示的保存期限為未開封狀態，開封後應依建議時間內使用，過期應丟棄。" }
      ]
    },
    {
      title: "藥品正確保存與丟棄重點整理：比對中",
      subtitle: "請點選兩張卡片，將標題與對應的說明文配對",
      pairs: [
        { title: "藥品包裝資訊", desc: "應保留說明書、原包裝、有效日期、用法用量等資料，方便查詢與正確使用。" },
        { title: "藥品安全存放", desc: "藥品應存放於兒童不易取得之處，避免誤食。" },
        { title: "藥品斷捨離", desc: "治療結束未服用完、過期、變質或開封已久的藥品應丟棄。" },
        { title: "藥品諮詢", desc: "有任何藥品使用、保存、丟棄等問題，可向藥師諮詢。" }
      ]
    }
  ];

  let pageIndex = 0;
  let cards = [];        // {id, pairId, type, label, matched}
  let selected = [];      // 目前選中的卡片 id（最多2個）
  let lock = false;       // 配對動畫期間鎖定點擊
  let matchedCount = 0;

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function initPage(){
    const page = pages[pageIndex];
    let raw = [];
    page.pairs.forEach((p, i) => {
      raw.push({ id: 't' + i, pairId: i, type: 'title', label: p.title, matched: false });
      raw.push({ id: 'd' + i, pairId: i, type: 'desc', label: p.desc, matched: false });
    });
    cards = shuffle(raw);
    selected = [];
    lock = false;
    matchedCount = 0;
    render();
  }

  function selectCard(id){
    if(lock) return;
    const card = cards.find(c => c.id === id);
    if(!card || card.matched) return;
    if(selected.includes(id)) return;
    if(selected.length >= 2) return;

    selected.push(id);
    render();

    if(selected.length === 2){
      lock = true;
      const c1 = cards.find(c => c.id === selected[0]);
      const c2 = cards.find(c => c.id === selected[1]);

      if(c1.pairId === c2.pairId && c1.type !== c2.type){
        // 配對成功
        setTimeout(() => {
          c1.matched = true;
          c2.matched = true;
          matchedCount += 2;
          selected = [];
          lock = false;
          render();
        }, 350);
      } else {
        // 配對失敗
        render(true);
        setTimeout(() => {
          selected = [];
          lock = false;
          render();
        }, 700);
      }
    }
  }

  function nextPage(){
    if(pageIndex < pages.length - 1){
      pageIndex++;
      initPage();
    } else {
      renderFinish();
    }
  }

  function renderFinish(){
    const root = document.getElementById('quiz-root');
    root.innerHTML = `
      <div class="finish-banner">
        <div class="big">✓ 全部練習完成！</div>
        <div class="small">您已完成藥品正確保存與丟棄重點整理練習。</div>
        <a class="back-link" href="https://pha.lib.cmuh.org.tw/p/PHlearning">回藥劑部學習平台</a>
      </div>
    `;
  }

  function render(showWrong){
    const root = document.getElementById('quiz-root');
    const page = pages[pageIndex];
    const allMatched = matchedCount === cards.length;

    let boardHtml = cards.map(c => {
      let cls = "match-card";
      if(c.type === 'title') cls += " title-card";
      if(c.matched) cls += " matched";
      else if(selected.includes(c.id)){
        cls += showWrong ? " wrong" : " selected";
      }
      const clickAttr = (!c.matched) ? `onclick="window.__match.selectCard('${c.id}')"` : "";
      return `<div class="${cls}" ${clickAttr}>${c.label}</div>`;
    }).join("");

    let footer = "";
    if(allMatched){
      const isLastPage = pageIndex === pages.length - 1;
      footer = `<div class="result-banner">
        <span>✓ 全部配對成功！</span>
        <button class="next-btn" onclick="window.__match.nextPage()">${isLastPage ? '完成' : '下一頁'}</button>
      </div>`;
    }

    root.innerHTML = `
      <h2 class="page-title">${page.title}</h2>
      <p class="subtitle">${page.subtitle}</p>
      <p class="progress">第 ${pageIndex + 1} / ${pages.length} 頁　｜　已配對 ${matchedCount/2} / ${page.pairs.length} 組</p>
      <div class="board">${boardHtml}</div>
      ${footer}
    `;
  }

  window.__match = { selectCard, nextPage };
  initPage();
})();
</script>

</body>
</html>
